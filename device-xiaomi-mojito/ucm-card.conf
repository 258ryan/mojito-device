# Use case configuration for the Xiaomi Redmi Note 10 (mojito/sunny), mainline sm8250-style card
# -> /usr/share/alsa/ucm2/conf.d/sm8250/xiaomi-XiaomiRedmiNote10.conf (DMI long name; "Xiaomi Redmi Note 10.conf" links to it)

Syntax 3

SectionUseCase."HiFi" {
	File "/Xiaomi/mojito/HiFi.conf"
	Comment "HiFi quality Music."
}

SectionUseCase."Voice Call" {
	File "/Xiaomi/mojito/VoiceCall.conf"
	Comment "Voice calls."
}
